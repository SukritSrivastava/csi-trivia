# Render Blueprint for the Hermes Quiz game server (server/).
# Render dashboard → New → Blueprint → pick this repo. See docs/DEPLOY.md.
# Values marked "sync: false" are asked for in the dashboard (never commit them).
services:
  - type: web
    name: hermes-quiz-game
    runtime: node
    plan: free
    branch: main # what's live; frontend/backend are merged into main
    buildCommand: npm ci
    startCommand: npm run start:game
    healthCheckPath: /health
    envVars:
      - key: GAME_PRESET
        value: event
      - key: NODE_VERSION
        value: "24"
      - key: ADMIN_PIN # quizmaster PIN; use something longer than 1234
        sync: false
      - key: DATABASE_URL # Supabase → Connect → Session pooler, password filled in
        sync: false
      - key: PUBLIC_WEB_URL # the Vercel address, e.g. https://hermes-quiz.vercel.app
        sync: false
      - key: CORS_ORIGIN # the same Vercel address
        sync: false
      # In-game defaults (optional; these are the event preset's values). Admin → a quiz → Settings can
      # still change them per quiz. Full list and what each does: .env.example.
      - key: ROUND1_READ_SECONDS
        value: "8"
      - key: ROUND1_ANSWER_SECONDS
        value: "8"
      - key: MULTI_ANSWER_SECONDS
        value: "15"
      - key: BLACKOUT_READ_SECONDS
        value: "5"
      - key: BLACKOUT_ANSWER_SECONDS
        value: "10"
